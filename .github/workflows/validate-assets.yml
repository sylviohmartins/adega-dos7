name: Validate visual assets

on:
  push:
    paths:
      - 'assets/**'
      - 'scripts/validate_assets.py'
      - '.gitattributes'
      - '.github/workflows/validate-assets.yml'
  pull_request:
    paths:
      - 'assets/**'
      - 'scripts/validate_assets.py'
      - '.gitattributes'
      - '.github/workflows/validate-assets.yml'

permissions:
  contents: read

jobs:
  validate-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate image assets
        run: python scripts/validate_assets.py
